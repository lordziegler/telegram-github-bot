name: CI

on:
  push:
    branches: [main]
  pull_request:  # never pull_request_target: fork PRs run with a read-only token and no secrets

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]  # oldest supported and newest
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install uv==0.12.13
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make test

  image:
    name: container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t telegram-github-bot:ci .
      - name: Image starts and rejects an empty configuration with exit code 2
        run: |
          set +e
          docker run --rm telegram-github-bot:ci
          test $? -eq 2
