name: CI

on:
  push:
    branches: [main]
  # Nunca pull_request_target: los PR de forks corren con token de solo lectura y sin secretos.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, tipos y tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]  # la más antigua soportada y la más nueva
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install uv==0.12.13
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make test

  image:
    name: imagen del contenedor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t telegram-github-bot:ci .
      - name: La imagen arranca y rechaza una configuración vacía con código 2
        run: |
          set +e
          docker run --rm telegram-github-bot:ci
          test $? -eq 2
