name: Desplegar

# Solo manual. Se conecta a tu servidor por SSH y ejecuta Docker Compose allí.
# Los secretos del bot (.env) viven en el servidor, no en GitHub.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy: usa la rama o tag elegido y reconstruye · restart: reinicia el contenedor"
        type: choice
        options: [deploy, restart]
        default: deploy

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production  # añade revisores obligatorios a este environment en los ajustes
    steps:
      - name: Configurar SSH (clave del host fijada, sin confiar a ciegas la primera vez)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ejecutar en el servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/telegram-github-bot' }}
          ACTION: ${{ inputs.action }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $(printf '%q ' "$ACTION" "$SHA" "$DEPLOY_PATH")" <<'REMOTE'
          set -euo pipefail
          action="$1"; sha="$2"; dir="$3"
          cd "$dir"
          if [ "$action" = deploy ]; then
            git fetch --quiet origin
            git checkout --quiet --detach "$sha"
            docker compose up -d --build --remove-orphans --wait --wait-timeout 180
          else
            docker compose restart bot
          fi
          docker compose ps
          REMOTE
      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/id_deploy
