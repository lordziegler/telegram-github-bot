services:
  bot:
    build: .
    image: telegram-github-bot:local
    env_file: .env
    environment:
      # Fijo: ignora el DATABASE_URL de .env (vacío = en memoria; una ruta relativa caería en
      # /app, que es de solo lectura). El volumen bot-data es lo único escribible.
      DATABASE_URL: sqlite:////data/bot.db
    volumes:
      - bot-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Solo en modo webhook: expón el puerto a tu proxy inverso con TLS (nunca directamente).
    # ports:
    #   - "127.0.0.1:8080:8080"

volumes:
  bot-data:
