services:
  bot:
    build: .
    image: telegram-github-bot:local
    env_file: .env
    environment:
      # Si no, un DATABASE_URL vacío en .env significaría "en memoria" dentro del contenedor.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/bot.db}
    volumes:
      - bot-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Solo en modo webhook: expón el puerto a tu proxy inverso con TLS (nunca directamente).
    # ports:
    #   - "127.0.0.1:8080:8080"

volumes:
  bot-data:
