[project]
name = "telegram-github-bot"
version = "0.1.0"
description = "Bot de Telegram autoalojable para gestionar repositorios de GitHub (issues, PRs, CI, Actions) con acceso por roles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot>=22.8,<23", "pynacl>=1.5,<2"]

[project.optional-dependencies]
webhooks = ["python-telegram-bot[webhooks]>=22.8,<23"]
github-app = ["pyjwt[crypto]>=2.10,<3"]

[project.scripts]
tgbot = "tgbot.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "mypy>=1.18", "pyjwt[crypto]>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
